    <style>
        :root {
            --bg-primary: #0a0608;
            --color-primary: #c8324b;
            --color-secondary: #d4a853;
            --color-text: #e8d5d5;
            --color-muted: #b09090;
            --color-accent: #8b0020;
            --glass-bg: rgba(20, 10, 15, 0.9);
            --glass-border: rgba(200, 50, 75, 0.15);
            --glow-color: rgba(200, 50, 75, 0.3);
            --clock-glow: rgba(212, 168, 83, 0.4);
        }
        body.white-queen {
            --bg-primary: #0c0c20;
            --color-primary: #8888cc;
            --color-secondary: #c0c0e8;
            --color-text: #e0e0f5;
            --color-muted: #9090c0;
            --color-accent: #5050a0;
            --glass-bg: rgba(15, 15, 40, 0.9);
            --glass-border: rgba(128, 128, 200, 0.15);
            --glow-color: rgba(128, 128, 200, 0.3);
            --clock-glow: rgba(200, 200, 230, 0.5);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Raleway', sans-serif;
            color: var(--color-text);
            background: var(--bg-primary);
            overflow-x: hidden;
            transition: background 1s, color 1s;
            line-height: 1.6;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139,0,20,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(80,0,40,0.12) 0%, transparent 50%);
            z-index: -2;
            pointer-events: none;
        }
        body.white-queen::before {
            background:
                radial-gradient(ellipse at 20% 50%, rgba(100,100,180,0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(80,80,160,0.1) 0%, transparent 50%);
        }
        .particula {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            animation: flotar linear infinite;
            z-index: -1;
        }
        @keyframes flotar {
            0% { transform: translateY(100vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
        .particula-reloj {
            position: fixed;
            font-size: 12px;
            opacity: 0.15;
            pointer-events: none;
            animation: flotar-reloj linear infinite;
            z-index: -1;
        }
        @keyframes flotar-reloj {
            0% { transform: translateY(100vh); opacity: 0; }
            15% { opacity: 0.2; }
            85% { opacity: 0.2; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
        .anillo-tiempo {
            position: fixed;
            border: 1px solid var(--color-secondary);
            border-radius: 50%;
            pointer-events: none;
            animation: expandir 3s ease-out forwards;
            z-index: -1;
            opacity: 0;
        }
        @keyframes expandir {
            0% { transform: scale(0); opacity: 0.4; }
            100% { transform: scale(8); opacity: 0; }
        }
        nav {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;

            font-size: 0.88rem;
            letter-spacing: 1px;

            padding: 0.5rem 0.8rem;

            border: 1px solid transparent;

            background-clip: text;

            letter-spacing: 5px;
            margin-top: 1rem;

            96% { transform: translate(3px, -1px); }
